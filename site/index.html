<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official Goose graphics examples running in WebAssembly.">
  <title>Examples · Goose</title>
  <link rel="icon" href="./assets/goose-favicon.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./">
      <img src="./assets/goose-logo.png" alt="">
      <span>Goose</span>
      <span class="brand-sub">Examples</span>
    </a>
  </header>

  <div class="page">
    <aside class="toc">
      <nav id="gallery" class="gallery" aria-label="Examples"></nav>
    </aside>

    <main class="workspace" aria-labelledby="demo-title">
      <h1 id="demo-title" class="demo-title"></h1>

      <blockquote class="notice" id="compatibility" hidden>
        <strong>WebAssembly JSPI required:</strong> this GPU example needs a browser with JSPI enabled
        (Chrome 137+ or Firefox/Safari with JSPI). The software examples in the menu run in any browser.
      </blockquote>

      <div class="stage" id="stage">
        <div class="stage-media" id="stage-media"></div>
        <div id="stage-message" class="stage-message" role="status">Loading…</div>
        <div class="life-controls" id="life-controls" hidden>
          <button id="life-play" type="button">Pause</button>
          <input type="range" id="life-position" min="0" value="0" aria-label="Generation">
          <output id="life-label" for="life-position"></output>
        </div>
      </div>

      <details id="code-disclosure" class="code-disclosure">
        <summary>Code <code id="code-filename"></code></summary>
        <div class="code-body">
          <div class="code-actions">
            <button id="copy-source" type="button" disabled>Copy</button>
            <span id="source-status" role="status"></span>
            <a id="upstream-source" target="_blank" rel="noopener">View on GitHub ↗</a>
          </div>
          <pre id="source-code" class="source-code" tabindex="0" aria-label="Goose source code"></pre>
        </div>
      </details>
    </main>
  </div>
</body>
</html>
