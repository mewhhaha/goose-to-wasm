name: Compiler qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # External fork PRs are held before this workflow starts by the repository
  # Actions setting (approval_policy: all_external_contributors -> 1-click
  # "Approve and run"). Same-repo branch PRs pause here on the pr-ci-approval
  # environment until the maintainer approves. Nothing executes on any PR
  # until explicitly approved.
  approve-branch-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    environment: pr-ci-approval
    runs-on: ubuntu-24.04
    steps:
      - name: Pull request CI approved
        run: echo "Maintainer approved CI for PR #${{ github.event.pull_request.number }}"

  qualify:
    needs: [approve-branch-pr]
    if: always() && (needs.approve-branch-pr.result == 'success' || needs.approve-branch-pr.result == 'skipped')
    uses: ./.github/workflows/_qualify.yml
