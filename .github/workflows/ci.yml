name: Compiler qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read engine pin
        id: pins
        run: |
          python - <<'PYTHON'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('node=' + json.load(open('toolchain.json'))['node'], file=output)
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install C compiler and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          python -m pip install -r requirements.txt
      - name: Build Goose and verify self-hosting
        id: compiler
        run: python scripts/bootstrap.py --verify
      - name: Build Wasmtime host
        run: python scripts/build_wasmtime_host.py
      - name: Source and output contracts
        run: >-
          python tests/conformance.py --compiler build/bin/goose
          --output-dir build/conformance --levels 0 2 --timeout 20
      - name: Curated WebAssembly contracts on V8
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: >-
          python tests/conformance.py --compiler build/bin/goose
          --output-dir build/conformance-v8 --filter corpus/ --levels 0 2 --engine v8 --timeout 20
      - name: Publish qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-linux-x64
          if-no-files-found: warn
          path: |
            build/bootstrap/
            build/toolchain.json
            build/conformance/report.json
            build/conformance-v8/report.json
            build/bin/goose-wasmtime.json
