name: Compiler qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EMCC_CORES: "2"
      EM_CACHE: ${{ github.workspace }}/build/em-cache
      TMPDIR: ${{ github.workspace }}/build/tmp
    steps:
      - uses: actions/checkout@v4
      - name: Read toolchain pins
        id: pins
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          pins = json.loads(Path("toolchain.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("node=" + pins["node"], file=output)
          PY
          mkdir -p build/tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install build tools and Wasmtime
        run: |
          python -m pip install cmake==4.4.4 ninja==1.13.2 -r requirements.txt
          echo "EM_NODE_JS=$(command -v node)" >> "$GITHUB_ENV"
      - name: Build pinned compiler
        run: python scripts/bootstrap.py --generator Ninja --jobs 2
      - name: Pinned language capability inventory
        run: python scripts/check_capabilities.py
      - name: Install pinned Emscripten
        run: |
          python scripts/install_emsdk.py --jobs 2
          echo "${{ github.workspace }}/build/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Record engine and compiler identities
        run: |
          python scripts/goose_wasm.py version
          node -p 'JSON.stringify({node: process.version, v8: process.versions.v8})'
          python -c 'from importlib.metadata import version; print("Wasmtime", version("wasmtime"))'
          cat build/toolchain.json
      - name: Verify shared engine features
        run: python scripts/check_engines.py --output build/engine-probes.json
      - name: Oracle source and driver contracts
        run: |
          python oracle/tests/test_bootstrap.py
          python oracle/tests/test_target.py
          python oracle/tests/test_driver.py
          python oracle/tests/test_qualification.py
      - name: Full C-Wasm portability corpus
        run: python oracle/tests/run_tests.py --full --jobs 2
      - name: Memory64 and native GCC comparison
        run: >-
          python oracle/tests/run_tests.py --quick --memory64 --native-gcc gcc
          --jobs 2 --output-dir build/oracle/memory64-results
      - name: Direct, C-Wasm and native differential qualification
        run: >-
          python tests/run_differential.py --engines v8 wasmtime
          --backends direct c-wasm native
      - name: Aggregate returns and scalar math qualification
        run: python tests/test_backend_extensions.py
      - name: Sparse static data and memory limits
        run: python tests/test_static_data.py
      - name: Stable regions, memory isolation and scoped owner cleanup
        run: |
          python tests/test_regions.py
          python tests/test_dynamic_boundaries.py
          python tests/test_static_capture_boundaries.py
          python tests/test_variable_enum_boundaries.py
          python tests/test_variable_variant_boundaries.py
          python tests/test_owned_struct_boundaries.py
          python tests/test_packed_layout_boundaries.py
          python tests/test_array_images.py
      - name: LangArena inputs and measurement contracts
        run: python tests/test_langarena.py
      - name: LangArena official small cases and observable marker edits
        run: |
          python bench/langarena.py fetch
          python bench/langarena.py check --output-dir build/langarena-smoke
          python bench/qualify_sieve.py --output-dir build/isolated-sieve-smoke
      - name: Incremental cache correctness
        run: python tests/test_incremental.py
      - name: Configuration and module-search dependency tracking
        run: python tests/test_input_dependencies.py
      - name: Native compiler sessions and source overlays
        run: python tests/test_compiler_session.py
      - name: Lexer transition reuse and source ownership under sanitizers
        run: python tests/test_lexical_cache.py
      - name: Parsed module caching and semantic isolation
        run: python tests/test_syntax_cache.py
      - name: Syntax import ownership under sanitizers
        run: python tests/test_syntax_importer.py
      - name: Checked scalar leaf reuse and invalidation
        run: python tests/test_checked_leaf_cache.py
      - name: Checked scalar caller contracts and invalidation
        run: python tests/test_checked_scalar_cache.py
      - name: Checked scalar ownership, nested eviction, and bounds under sanitizers
        run: python tests/test_checked_leaf_ownership.py
      - name: Incremental rebuild measurement smoke
        run: |
          python bench/incremental.py --samples 3
          python bench/incremental.py --samples 3 --shape leaves --native-worker --syntax-cache --checked-leaf-cache
          python bench/incremental.py --samples 3 --native-worker --syntax-cache --checked-scalar-cache
          python bench/incremental.py --samples 3 --native-worker --syntax-cache --checked-scalar-cache --edit-source-mode overlay
      - name: Benchmark harness correctness smoke
        run: >-
          python bench/benchmark.py --smoke --samples 2 --compile-samples 1
          --warmups 1 --output-dir build/benchmark-smoke
      - name: Package compiler and corresponding sources
        run: |
          tar --exclude=source/.git -C build -czf build/compiler-linux-x64.tar.gz bin source toolchain.json source.json
      - name: Publish qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-linux-x64
          if-no-files-found: warn
          path: |
            build/toolchain.json
            build/source.json
            build/engine-probes.json
            build/compiler-linux-x64.tar.gz
            build/oracle/**/report.json
            build/oracle/driver-tests/
            build/oracle/target-tests/
            build/differential/
            build/backend-extensions/
            build/langarena-smoke/
            build/isolated-sieve-smoke/
            build/benchmark-smoke/
            build/incremental-benchmark.json
